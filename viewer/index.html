<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Viewer — rcheevos-js</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --panel2: #232733; --border: #2e3342;
    --text: #d7dae3; --dim: #8b90a0; --accent: #6aa2ff;
    --waiting: #555b6b; --active: #3b6ea5; --paused: #8a5fb0; --primed: #d0a02f;
    --reset: #d0662f; --triggered: #3fa860; --inactive: #3a3f4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
  header .desc { color: var(--dim); flex: 1; min-width: 120px; }
  select, input[type=text], button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px; font: inherit;
  }
  select:focus, input:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }
  .left {
    width: 46%; min-width: 380px; display: flex; flex-direction: column;
    padding: 12px; gap: 10px; border-right: 1px solid var(--border); overflow-y: auto;
  }
  /* long memory tables must scroll, not squash the panes above them */
  .left > * { flex-shrink: 0; }
  .right { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto; }

  .shot {
    background: #000; border: 1px solid var(--border); border-radius: 6px;
    aspect-ratio: 3/2; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .shot .placeholder { color: var(--dim); }
  .shot .caption {
    position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,.65);
    padding: 2px 7px; border-radius: 4px; font-size: 11px; color: var(--dim);
  }

  .transport { display: flex; gap: 8px; align-items: center; }
  .transport input[type=range] { flex: 1; }
  .framebox { font-variant-numeric: tabular-nums; min-width: 130px; text-align: right; }
  .statebadge {
    padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--inactive);
  }

  canvas.timeline {
    width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 5px;
    cursor: crosshair; display: block; background: var(--panel2);
  }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--dim); font-size: 11px; }
  .legend span::before {
    content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 4px; background: var(--c);
  }

  .markers { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .marker-chip {
    display: inline-flex; gap: 5px; align-items: center; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 12px; padding: 2px 4px 2px 10px; font-size: 12px;
  }
  .marker-chip b { color: var(--accent); font-weight: 600; cursor: pointer; }
  .marker-chip .x { color: var(--dim); cursor: pointer; padding: 0 5px; }
  .marker-chip .x:hover { color: #e06c75; }

  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 4px 0 2px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 11px; }
  td.num, th.num { text-align: right; }
  tr.changed td { background: rgba(106,162,255,.10); }
  tr.changed td.val { color: var(--accent); font-weight: 600; }
  .addr { color: var(--dim); }
  .dimtext { color: var(--dim); }

  .trigger-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .trigger-head input[type=text] { flex: 1; min-width: 220px; font-family: ui-monospace, monospace; font-size: 12px; }
  .cond-text { font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
  td.dot { width: 20px; }
  .dot span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--inactive); }
  .dot span.on { background: var(--triggered); }
  .groupname { color: var(--dim); font-size: 11px; padding-top: 10px; }
  .measured { display: flex; align-items: center; gap: 8px; }
  .measured[hidden] { display: none; }
  .left { overflow-x: hidden; }
  .measured .bar { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .measured .bar div { height: 100%; background: var(--primed); }
  .error { color: #e06c75; font-family: ui-monospace, monospace; font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Scenario Viewer</h1>
    <label>Scenario <select id="scenario-select"></select></label>
  <span class="desc" id="scenario-desc"></span>
  <span class="hint" id="save-hint"></span>
  <label>Achievement <select id="achievement-select"><option value="">(none)</option></select></label>
</header>

<main>
  <section class="left">
    <div class="shot" id="shot">
      <span class="placeholder">no scenario loaded</span>
    </div>
    <div class="transport">
      <button id="btn-start" title="Home">⇤</button>
      <button id="btn-back10" title="Shift+←">−10</button>
      <button id="btn-back" title="←">−1</button>
      <button id="btn-play" title="Space">▶</button>
      <button id="btn-fwd" title="→">+1</button>
      <button id="btn-fwd10" title="Shift+→">+10</button>
      <button id="btn-end" title="End">⇥</button>
      <input type="range" id="slider" min="0" max="0" value="0">
      <span class="framebox"><span id="frame-no">–</span> <span class="dimtext" id="frame-range"></span></span>
      <span class="statebadge" id="state-badge">no trigger</span>
    </div>
    <canvas class="timeline" id="timeline"></canvas>
    <div class="legend">
      <span style="--c:var(--waiting)">waiting</span>
      <span style="--c:var(--active)">active</span>
      <span style="--c:var(--paused)">paused</span>
      <span style="--c:var(--primed)">primed</span>
      <span style="--c:var(--reset)">reset</span>
      <span style="--c:var(--triggered)">triggered</span>
      <span style="--c:var(--inactive)">inactive (after pop)</span>
    </div>
    <div class="markers" id="markers">
      <input type="text" id="marker-name" placeholder="marker name" size="12">
      <button id="marker-add">+ marker at frame</button>
    </div>
    <h2>Memory</h2>
    <table id="memory-table">
      <thead><tr><th>Label</th><th>Address</th><th class="num">Value</th><th class="num">Hex</th><th class="num">Prev</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="right">
    <div class="trigger-head">
      <h2 style="margin:0">Trigger</h2>
      <input type="text" id="trigger-input" placeholder="paste a trigger definition, or pick an achievement above" spellcheck="false">
    </div>
    <div class="error" id="trigger-error"></div>
    <div class="measured" id="measured" hidden>
      <span class="dimtext">Measured</span>
      <div class="bar"><div id="measured-fill"></div></div>
      <span id="measured-text" class="framebox"></span>
    </div>
    <div id="cond-groups" class="hint">Pick an achievement or paste a trigger string to inspect per-condition state for every frame.</div>
  </section>
</main>

<script type="module" src="./viewer.js"></script>
</body>
</html>
